[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jewoulingo-discovery"
version = "0.1.0"
description = "AI Cross-Shas Formula Discovery Engine for Jewoulingo: mines recurring function-word skeletons across the Bavli and ranks candidate teachable pairs."
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
discover = "discovery.cli:main"

[tool.setuptools]
packages = ["discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
